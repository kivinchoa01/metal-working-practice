<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金工实习（冷、热加工）· 课件</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC",
                 system-ui, sans-serif;
    background: #1b1b1f; color: #eee;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 18px; background: #7a1f1f; color: #fff;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  header .meta { font-size: 13px; opacity: .85; }
  header nav { margin-left: auto; display: flex; gap: 12px; }
  header a {
    color: #fff; font-size: 13px; text-decoration: none;
    border: 1px solid rgba(255,255,255,.45);
    padding: 4px 10px; border-radius: 14px; white-space: nowrap;
  }
  header a:hover { background: rgba(255,255,255,.15); }
  main { flex: 1; min-height: 0; background: #525659; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  @media (max-width: 640px) {
    header { padding: 8px 12px; gap: 6px; }
    header h1 { font-size: 15px; }
    header .meta { order: 3; width: 100%; font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>金工实习（冷、热加工）</h1>
  <span class="meta">西北工业大学 · 周计明 · 2026 年秋</span>
  <nav>
    <a href="https://cdn.jsdelivr.net/gh/kivinchoa01/metal-working-practice@master/metalworkingpractice.pdf" target="_blank" rel="noopener">下载 PDF</a>
    <a href="https://gitee.com/zhou-jiming/metal-working-practice" target="_blank" rel="noopener">Gitee 仓库</a>
  </nav>
</header>
<main>
  <iframe src="docs/pdfjs/web/viewer.html?file=https://cdn.jsdelivr.net/gh/kivinchoa01/metal-working-practice@master/metalworkingpractice.pdf#pagemode=none"
          title="金工实习课件" allow="fullscreen" allowfullscreen></iframe>
</main>
<script>
(function () {
  const frame = document.querySelector('main iframe');
  const PANEL_ID = 'wp-link-panel';

  // B 站视频页转换为可嵌入的播放器地址
  function embedUrl(url) {
    try {
      const u = new URL(url);
      if (/(^|\.)bilibili\.com$/i.test(u.hostname) && /^\/video\//.test(u.pathname)) {
        const m = u.pathname.match(/\/video\/(BV[0-9A-Za-z]+)/);
        if (m) {
          return 'https://player.bilibili.com/player.html?bvid=' + m[1] +
                 '&page=1&autoplay=0';
        }
      }
    } catch (e) { /* 保持原地址 */ }
    return url;
  }

  function openPanel(url, doc) {
    const host = doc.getElementById('viewerContainer') || doc.body;
    let panel = doc.getElementById(PANEL_ID);
    if (!panel) {
      const style = doc.createElement('style');
      style.textContent = [
        '#' + PANEL_ID + ' { position: fixed; left: 50%; top: 50%;',
        '  transform: translate(-50%, -50%); width: min(960px, 76vw);',
        '  height: min(620px, 76vh); min-width: 360px; min-height: 240px;',
        '  display: flex; flex-direction: column; overflow: hidden; resize: both;',
        '  background: #fff; border-radius: 10px;',
        '  box-shadow: 0 24px 80px rgba(0,0,0,.55); z-index: 60000; }',
        '#' + PANEL_ID + ' .wp-bar { display: flex; align-items: center; gap: 8px;',
        '  padding: 7px 12px; background: #7a1f1f; color: #fff;',
        '  font: 13px/1.4 "Microsoft YaHei", system-ui, sans-serif; }',
        '#' + PANEL_ID + ' .wp-title { flex: 1; overflow: hidden;',
        '  text-overflow: ellipsis; white-space: nowrap; }',
        '#' + PANEL_ID + ' button { font: 12px/1 inherit; color: #fff;',
        '  background: transparent; border: 1px solid rgba(255,255,255,.55);',
        '  border-radius: 12px; padding: 4px 9px; cursor: pointer; }',
        '#' + PANEL_ID + ' button:hover { background: rgba(255,255,255,.15); }',
        '#' + PANEL_ID + ' .wp-close { font-size: 16px; line-height: 1;',
        '  padding: 0 8px; border-radius: 50%; }',
        '#' + PANEL_ID + ' iframe { flex: 1; width: 100%; border: 0; background: #fff; }'
      ].join('\n');
      doc.head.appendChild(style);

      panel = doc.createElement('div');
      panel.id = PANEL_ID;
      panel.innerHTML =
        '<div class="wp-bar"><span class="wp-title"></span>' +
        '<button type="button" class="wp-ext">新窗口</button>' +
        '<button type="button" class="wp-close" aria-label="关闭">×</button></div>' +
        '<iframe class="wp-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
      host.appendChild(panel);

      // 阻止演示模式的“点击翻页”处理接管浮层内的交互
      ['mousedown', 'click', 'dblclick'].forEach(function (t) {
        panel.addEventListener(t, function (e) { e.stopPropagation(); });
      });

      panel.querySelector('.wp-close').addEventListener('click', function () {
        closePanel(doc);
      });
      panel.querySelector('.wp-ext').addEventListener('click', function () {
        const w = Math.min(960, Math.round(screen.availWidth * 0.7));
        const h = Math.min(640, Math.round(screen.availHeight * 0.7));
        const left = Math.round((screen.availWidth - w) / 2);
        const top = Math.round((screen.availHeight - h) / 2);
        window.open(panel.dataset.url, '_blank',
          'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
      });
    }

    const embed = embedUrl(url);
    panel.dataset.url = url;
    let title = url;
    try {
      const u = new URL(url);
      title = u.hostname + (embed !== url ? ' · B站播放器' : '');
    } catch (e) { /* 保持原地址 */ }
    panel.querySelector('.wp-title').textContent = title;
    const f = panel.querySelector('.wp-frame');
    if (f.getAttribute('src') !== embed) f.src = embed;
  }

  function closePanel(doc) {
    const panel = doc.getElementById(PANEL_ID);
    if (!panel) return;
    const f = panel.querySelector('.wp-frame');
    if (f) f.src = 'about:blank';
    panel.remove();
  }

  function setup() {
    const doc = frame.contentDocument;
    if (!doc) return;
    doc.addEventListener('click', function (e) {
      const a = e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      const href = a.href;
      if (!/^https?:\/\//i.test(href)) return;
      const sec = a.closest('section');
      if (sec && sec.hasAttribute('data-internal-link')) return;
      e.preventDefault();
      e.stopPropagation();
      openPanel(href, doc);
    }, true);
  }

  frame.addEventListener('load', setup);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') setup();
})();
</script>
</body>
</html>
